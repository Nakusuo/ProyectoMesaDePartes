# Configuración para Railway usando Maven directamente
[providers]
java = "21"

[phases.setup]
nixPkgs = ["maven", "openjdk21"]

[phases.build]
cmds = [
  "cd backend",
  "chmod +x mvnw",
  "./mvnw clean package -DskipTests -B"
]

[start]
cmd = "cd backend && java -Xms256m -Xmx512m -jar target/*.jar"
