# Configuración de la Base de Datos (Ya deberías tenerla de tu script)
spring.datasource.url=jdbc:mysql://localhost:3306/mesa_partes_db
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de JWT
# IMPORTANTE: Esta es una clave en Base64 generada aleatoriamente
# En producción, usa variables de entorno: ${JWT_SECRET}
mesadepartes.app.jwtSecret=Q2xhdmVTZWNyZXRvUGFyYU1lc2FEZVBhcnRlc1BOUFF1ZUVzTXV5RGlmaWNpbERlQWRpdmluYXJZRXNhRXNMYUlkZWE=
# Expiración (8 horas en milisegundos)
mesadepartes.app.jwtExpirationMs=28800000

