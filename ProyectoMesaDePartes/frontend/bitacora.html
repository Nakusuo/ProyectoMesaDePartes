<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Mesa de Partes PNP</title>
  
  <!-- Estilos Globales -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/bitacora.css">

</head>
<body>

  <!-- El sidebar se insertará aquí automáticamente via JavaScript -->

  <main class="main-content">
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Dashboard - Bitácora de Eventos</h2>
          <div>
            <button class="btn btn-secondary btn-sm">
              <span>📥</span>
              Exportar
            </button>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <p style="color: var(--text-secondary);">Registro de acciones realizadas en el sistema de Mesa de Partes.</p>
        </div>

        <table>
          <thead>
            <tr>
              <th>Fecha y Hora</th>
              <th>Usuario</th>
              <th>Acción</th>
              <th>Entidad</th>
              <th>Detalles</th>
            </tr>
          </thead>
          <tbody id="bitacora-table-body">
            <!-- Los eventos se cargarán aquí con JavaScript -->
            <tr>
              <td colspan="5" style="text-align: center; padding: 40px;">
                <div class="spinner" style="margin: 0 auto;"></div>
                <p style="margin-top: 16px; color: var(--text-light);">Cargando eventos...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Sidebar Script (debe cargarse primero) -->
  <script src="assets/js/sidebar.js"></script>
  
  <!-- Módulo de Autenticación -->
  <script src="assets/js/auth.js"></script>
  
  <!-- Lógica Específica de esta página -->
  <script src="assets/js/bitacora.js"></script>
</body>
</html>
