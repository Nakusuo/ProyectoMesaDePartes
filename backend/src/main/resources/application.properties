# =====================================================
# CONFIGURACIÓN DE PRODUCCIÓN - Mesa de Partes PNP
# Usa variables de entorno del archivo .env
# =====================================================

# Configuración de Base de Datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mesa_partes_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de JWT
mesadepartes.app.jwtSecret=${JWT_SECRET:Q2xhdmVTZWNyZXRvUGFyYU1lc2FEZVBhcnRlc1BOUFF1ZUVzTXV5RGlmaWNpbERlQWRpdmluYXJZRXNhRXNMYUlkZWE=}
mesadepartes.app.jwtExpirationMs=28800000

# Configuración de CORS
mesadepartes.app.allowedOrigins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Configuración de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de archivos estáticos
spring.web.resources.static-locations=file:../frontend/
spring.web.resources.add-mappings=true

# Configuración de Email (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración de Logging
logging.level.root=INFO
logging.level.com.pnp.mesadepartes=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.file.name=logs/mesa-partes.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Configuración del Servidor
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=on_param

# SSL/HTTPS Configuration (Producción)
# Descomentar y configurar para producción
#server.ssl.enabled=${SSL_ENABLED:false}
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=tomcat

# Spring Boot Actuator (Monitoreo)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
