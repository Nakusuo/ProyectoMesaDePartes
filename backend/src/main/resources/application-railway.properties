# =====================================================
# CONFIGURACIÓN PARA RAILWAY - Mesa de Partes PNP
# =====================================================

# Puerto del servidor (Railway usa PORT variable)
server.port=${PORT:8080}

# =====================================================
# CONFIGURACIÓN DE BASE DE DATOS RAILWAY MySQL
# =====================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:railway}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones optimizado para Railway
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================
# CONFIGURACIÓN DE JPA - IMPORTANTE: Crear tablas automáticamente
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =====================================================
# CONFIGURACIÓN DE JWT
# =====================================================
mesadepartes.app.jwtSecret=${JWT_SECRET:Q2xhdmVTZWNyZXRvUGFyYU1lc2FEZVBhcnRlc1BOUFF1ZUVzTXV5RGlmaWNpbERlQWRpdmluYXJZRXNhRXNMYUlkZWE=}
mesadepartes.app.jwtExpirationMs=28800000

# =====================================================
# CORS - Permitir todos los orígenes en Railway
# =====================================================
mesadepartes.app.allowedOrigins=*

# =====================================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=/app/uploads

# =====================================================
# ACTUATOR HEALTH CHECK PARA RAILWAY
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.access=unrestricted
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.health.db.enabled=true
management.server.port=${PORT:8080}
server.forward-headers-strategy=framework

# =====================================================
# CONFIGURACIÓN DE LOGGING PARA RAILWAY
# =====================================================
logging.level.root=INFO
logging.level.com.pnp.mesadepartes=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =====================================================
# CONFIGURACIÓN DE EMAIL (OPCIONAL)
# =====================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================
# CONFIGURACIÓN DE ARCHIVOS ESTÁTICOS
# =====================================================
spring.web.resources.add-mappings=false

# =====================================================
# CONFIGURACIÓN DE SEGURIDAD PARA PRODUCCIÓN
# =====================================================
server.error.include-message=always
server.error.include-stacktrace=never
