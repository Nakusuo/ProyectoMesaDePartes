<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Mesa de Partes PNP</title>
  
  <link rel="stylesheet" href="../../assets/css/core/style.css">
  <link rel="stylesheet" href="../../assets/css/components/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages/dashboard.css">
  
  <!-- Chart.js local (sin tracking de terceros) -->
  <script src="../../assets/js/libs/chart.min.js"></script>
</head>
<body>

  <!-- El sidebar se insertará aquí automáticamente -->

  <main class="main-content">
    <div class="container">
      
      <!-- Header -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Dashboard - Mesa de Partes PNP</h2>
          <div>
            <span id="fecha-actual" style="color: var(--text-secondary); font-size: 14px;"></span>
          </div>
        </div>
      </div>

      <!-- KPIs / Métricas -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;">
        
        <div class="card" style="text-align: center;">
          <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">
            📄 Total Documentos
          </div>
          <div id="total-documentos" style="font-size: 36px; font-weight: 700; color: var(--pnp-green);">
            <div class="spinner" style="margin: 10px auto; width: 30px; height: 30px;"></div>
          </div>
        </div>

        <div class="card" style="text-align: center;">
          <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">
            ⏳ En Proceso
          </div>
          <div id="documentos-proceso" style="font-size: 36px; font-weight: 700; color: var(--warning);">
            <div class="spinner" style="margin: 10px auto; width: 30px; height: 30px;"></div>
          </div>
        </div>

        <div class="card" style="text-align: center;">
          <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">
            Finalizados
          </div>
          <div id="documentos-finalizados" style="font-size: 36px; font-weight: 700; color: var(--success);">
            <div class="spinner" style="margin: 10px auto; width: 30px; height: 30px;"></div>
          </div>
        </div>

        <div class="card" style="text-align: center;">
          <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">
            Usuarios Activos
          </div>
          <div id="total-usuarios" style="font-size: 36px; font-weight: 700; color: var(--pnp-green-light);">
            <div class="spinner" style="margin: 10px auto; width: 30px; height: 30px;"></div>
          </div>
        </div>

      </div>

      <!-- Gráficas -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px;">
        
        <!-- Gráfica: Documentos por Tipo -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title" style="font-size: 16px;">Documentos por Tipo</h3>
          </div>
          <canvas id="chart-por-tipo" style="max-height: 300px;"></canvas>
        </div>

        <!-- Gráfica: Documentos por Estado -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title" style="font-size: 16px;">Documentos por Estado</h3>
          </div>
          <canvas id="chart-por-estado" style="max-height: 300px;"></canvas>
        </div>

      </div>

      <!-- Gráfica de Documentos en el Tiempo -->
      <div class="card" style="margin-top: 20px;">
        <div class="card-header">
          <h3 class="card-title" style="font-size: 16px;">📈 Documentos Registrados en el Tiempo</h3>
        </div>
        <canvas id="chart-tiempo" style="max-height: 300px;"></canvas>
      </div>

      <!-- Documentos Recientes -->
      <div class="card" style="margin-top: 20px;">
        <div class="card-header">
          <h3 class="card-title" style="font-size: 16px;">📄 Documentos Recientes</h3>
          <a href="registro.html" class="btn btn-primary btn-sm">
            <span>➕</span>
            Nuevo Documento
          </a>
        </div>
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Título</th>
              <th>Tipo</th>
              <th>Remitente</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="documentos-recientes-body">
            <tr>
              <td colspan="5" style="text-align: center; padding: 40px;">
                <div class="spinner" style="margin: 0 auto;"></div>
                <p style="margin-top: 16px; color: var(--text-light);">Cargando documentos...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="../../assets/js/core/permissions.js"></script>
  <script src="../../assets/js/components/sidebar.js"></script>
  <script src="../../assets/js/core/auth.js"></script>
  <script src="../../assets/js/core/config.js"></script>
  <script src="../../assets/js/pages/dashboard.js"></script>
</body>
</html>
