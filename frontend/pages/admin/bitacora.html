<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora - Mesa de Partes PNP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  
  <!-- Estilos Globales -->
  <link rel="stylesheet" href="../../assets/css/core/style.css?v=2">
  <link rel="stylesheet" href="../../assets/css/core/toast.css?v=2">
  <link rel="stylesheet" href="../../assets/css/components/sidebar.css?v=2">
  <link rel="stylesheet" href="../../assets/css/pages/admin/bitacora.css?v=2">

</head>
<body>

  <!-- El sidebar se insertará aquí automáticamente via JavaScript -->

  <main class="main-content">
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Dashboard - Bitácora de Eventos</h2>
          <div>
            <button class="btn btn-secondary btn-sm" id="btn-exportar-pdf" onclick="generarReportePDF()">
              <span>📥</span>
              Exportar PDF
            </button>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <p style="color: var(--text-secondary);">Registro de acciones realizadas en el sistema de Mesa de Partes.</p>
        </div>

        <!-- Filtros de búsqueda -->
        <div style="background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color);">
          <h3 style="margin: 0 0 15px 0; color: var(--pnp-green); font-size: 16px;">🔍 Filtros de Búsqueda</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div>
              <label style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-secondary);">Palabra Clave</label>
              <input type="text" id="filtro-palabra" placeholder="Buscar..." style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
            </div>
            <div>
              <label style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-secondary);">N° Documento</label>
              <input type="text" id="filtro-nro-doc" placeholder="DOC-000001" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
            </div>
            <div>
              <label style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-secondary);">N° HT</label>
              <input type="text" id="filtro-nro-ht" placeholder="HT-0001" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
            </div>
            <div>
              <label style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-secondary);">Personal Asignado</label>
              <select id="filtro-usuario" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                <option value="">Todos</option>
              </select>
            </div>
          </div>
          <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button id="btn-aplicar-filtros" class="btn btn-primary btn-sm">Aplicar Filtros</button>
            <button id="btn-limpiar-filtros" class="btn btn-secondary btn-sm">Limpiar</button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Fecha y Hora</th>
              <th>Tipo</th>
              <th>Usuario</th>
              <th>Tipo Doc.</th>
              <th>Código</th>
              <th>Detalles</th>
              <th>Observaciones</th>
            </tr>
          </thead>
          <tbody id="bitacora-table-body">
            <!-- Los registros se cargarán aquí con JavaScript -->
            <tr>
              <td colspan="7" style="text-align: center; padding: 40px;">
                <div class="spinner" style="margin: 0 auto;"></div>
                <p style="margin-top: 16px; color: var(--text-light);">Cargando registros...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../../assets/js/core/config.js?v=4"></script>
  <script src="../../assets/js/components/toast.js?v=4"></script>
  <script src="../../assets/js/core/permissions.js?v=4"></script>
  <script src="../../assets/js/components/sidebar.js?v=4"></script>
  <script src="../../assets/js/core/auth.js?v=4"></script>
  <script src="../../assets/js/modules/reportes-global.js?v=4"></script>
  <script src="../../assets/js/pages/admin/bitacora.js?v=4"></script>
  <script>
    // Verificar permisos al cargar la página
    document.addEventListener('DOMContentLoaded', function() {
      if (window.permissionsManager) {
        window.permissionsManager.redirectIfUnauthorized('bitacora.html');
      }
    });
  </script>
</body>
</html>
