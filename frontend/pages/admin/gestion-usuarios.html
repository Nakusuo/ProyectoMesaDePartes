<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Mesa de Partes PNP</title>
    <link rel="icon" type="image/png" href="../../assets/images/logoPNP.png">
    <link rel="stylesheet" href="../../assets/css/core/style.css">
    <link rel="stylesheet" href="../../assets/css/components/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/pages/admin/gestion-usuarios.css">
    <link rel="stylesheet" href="../../assets/css/features/nuevas-funcionalidades.css">
</head>
<body>

    <!-- El sidebar se insertará aquí automáticamente -->

    <main class="main-content">
        <div class="container">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Gestión de Usuarios</h2>
                    <button id="btn-nuevo-usuario" class="btn btn-primary">
                        <span>+</span>
                        Nuevo Usuario
                    </button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Área</th>
                            <th>Roles</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">
                                <div class="spinner" style="margin: 0 auto;"></div>
                                <p style="margin-top: 16px; color: var(--text-light);">Cargando usuarios...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="user-modal" class="modal-backdrop" style="display: none;">
        <div class="modal">
            <h3 id="modal-title">Editar Usuario</h3>
            <form id="user-form">
                <input type="hidden" id="user-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido *</label>
                        <input type="text" id="apellido" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Usuario *</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="987654321">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Dejar en blanco para no cambiar">
                    <small id="password-hint">Solo ingresa contraseña si deseas cambiarla</small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tipo-contrato">Tipo de Contrato *</label>
                        <select id="tipo-contrato" required>
                            <option value="">Seleccione...</option>
                            <option value="CAS">CAS</option>
                            <option value="LOCADOR">LOCADOR</option>
                            <option value="PNP">PNP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="area-select">Área *</label>
                        <select id="area-select" required>
                            <option value="">Cargando áreas...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="roles-select">Rol *</label>
                    <select id="roles-select" required>
                        <option value="">Cargando roles...</option>
                    </select>
                </div>

                <div class="form-group-checkbox">
                    <input type="checkbox" id="activo" checked>
                    <label for="activo">Usuario Activo</label>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" id="btn-guardar" class="btn btn-primary">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js/core/config.js?v=4"></script>
    <script src="../../assets/js/modules/notificaciones.js"></script>
    <script src="../../assets/js/core/permissions.js"></script>
    <script src="../../assets/js/components/sidebar.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/pages/admin/gestion-usuarios.js"></script>
    <script>
        // Verificar permisos al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            if (window.permissionsManager) {
                window.permissionsManager.redirectIfUnauthorized('gestion-usuarios.html');
            }
        });
    </script>
</body>
</html>
