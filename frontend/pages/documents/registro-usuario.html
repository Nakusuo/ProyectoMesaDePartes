<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mesa de Partes PNP</title>
    <link rel="stylesheet" href="../../assets/css/core/style.css">
    <link rel="stylesheet" href="../../assets/css/pages/auth/login.css">
    <style>
        .registro-form-container form {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .login-link a {
            color: #00642e;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-branding">
             <img src="../../assets/images/logoPNP.png" alt="Logo PNP" style="width: 150px; height: auto;">
             <h2>Mesa de Partes Digital</h2>
             <p>Registro de Usuario - PNP</p>
        </div>

        <div class="login-form-container registro-form-container">
            <form id="registroForm">
                <h1>Crear Cuenta</h1>

                <div class="input-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
                </div>

                <div class="input-group">
                    <label for="apellido">Apellido *</label>
                    <input type="text" id="apellido" name="apellido" required placeholder="Ingrese su apellido">
                </div>

                <div class="input-group">
                    <label for="username">Usuario *</label>
                    <input type="text" id="username" name="username" required minlength="3" placeholder="Ingrese un usuario único">
                </div>

                <div class="input-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@pnp.gob.pe">
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="987654321">
                </div>

                <div class="input-group">
                    <label for="tipoContrato">Tipo de Contrato *</label>
                    <select id="tipoContrato" name="tipoContrato" required>
                        <option value="">Seleccione...</option>
                        <option value="CAS">CAS</option>
                        <option value="LOCADOR">LOCADOR</option>
                        <option value="PNP">PNP</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="area">Área</label>
                    <select id="area" name="area">
                        <option value="">-- Cargando áreas --</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirmar Contraseña *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>

                <p id="errorMessage" style="display: none; color: #dc3545; background: #ffe6e6; padding: 10px; border-radius: 5px; margin: 10px 0;" aria-live="polite"></p>
                <p id="successMessage" style="display: none; color: #28a745; background: #e6ffe6; padding: 10px; border-radius: 5px; margin: 10px 0;" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary login-button">Registrarse</button>

                <p class="login-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </form>
        </div>
    </div>

    <script src="../../assets/js/pages/auth/registro.js"></script>
</body>
</html>
